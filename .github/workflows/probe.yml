name: Data Source Test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas yfinance
      - run: python probe/probe.py
      - run: |
          git config user.name "smart-money-bot"
          git config user.email "smart-money-bot@users.noreply.github.com"
          git add probe/result.json && git commit -m "probe result" && git push || true
