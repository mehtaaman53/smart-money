name: Smart Money Daily

on:
  schedule:
    - cron: "33 14 * * 1-5"   # Mon–Fri raat 8:03 IST (NSE bhavcopy aane ke baad)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-money
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Data pipeline
        run: python pipeline.py
      - name: Save
        run: |
          git config user.name "smart-money-bot"
          git config user.email "smart-money-bot@users.noreply.github.com"
          git add data
          git commit -m "Data $(date +%F)" || echo "No changes"
          git pull --rebase
          git push
