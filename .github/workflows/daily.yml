name: Smart Money Daily

on:
  schedule:
    - cron: "33 14 * * 1-5"   # Mon–Fri raat 8:03 IST (NSE bhavcopy aane ke baad)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-money
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Data pipeline
        run: python pipeline.py
      - name: Industry stage + alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SEND_ALERT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python analyze.py
      - name: Save
        run: |
          git config user.name "smart-money-bot"
          git config user.email "smart-money-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Data $(date +%F)" || echo "No changes"
          git pull --rebase
          git push
